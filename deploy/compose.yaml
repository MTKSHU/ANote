name: anote
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: anote
      POSTGRES_USER: anote
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Run deploy/init-env.mjs in Docker first}"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anote -d anote"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: "postgres://anote:${DB_PASSWORD}@db:5432/anote"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Run deploy/init-env.mjs in Docker first}"
      PORT: "3000"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      CASDOOR_SERVER_URL: "${CASDOOR_SERVER_URL:-}"
      CASDOOR_APPLICATION: "${CASDOOR_APPLICATION:-}"
      CASDOOR_CLIENT_ID: "${CASDOOR_CLIENT_ID:-}"
      CASDOOR_CLIENT_SECRET: "${CASDOOR_CLIENT_SECRET:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:-}"
      ASSET_ROOT: /data/resources
      MAX_ASSET_BYTES: "${MAX_ASSET_BYTES:-34359738368}"
      TZ: Asia/Shanghai
    ports:
      - "${ANOTE_BIND_IP:-127.0.0.1}:${ANOTE_PORT:-3100}:3000"
    volumes:
      - originals:/data/resources/originals
      - uploads:/data/resources/uploads
      - previews:/data/resources/derived
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [anote.internal]
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL: "postgres://anote:${DB_PASSWORD}@db:5432/anote"
      ASSET_ROOT: /data/resources
    volumes:
      - originals:/data/resources/originals:ro
      - previews:/data/resources/derived
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
volumes:
  database:
  originals:
  uploads:
  previews:
